    <g stroke="#268b92" transform="translate(67 72)">
      <circle cx="0" cy="-9" r="5.5" fill="#ffffff"/>
      <path d="M-9.5 12 C-9.5 3 -5 0 0 0 C5 0 9.5 3 9.5 12" fill="#ffffff"/>
    </g>
