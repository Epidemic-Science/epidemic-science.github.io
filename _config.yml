# ==============================================================================
# EPIDEMIC SCIENCE HUB — SITE CONFIGURATION
# Built with Jekyll + the minima theme (same stack as ceph-lab.github.io).
# GitHub Pages rebuilds the site automatically on every push to `main`.
# Changes to this file are NOT picked up by `jekyll serve` — restart it.
# ==============================================================================

title: Epidemic Science Hub
description: >-
  A hub of three research laboratories at the Indiana University School of
  Public Health - Bloomington advancing the science of infectious disease
  epidemiology.
url: "https://epidemic-science.github.io"
baseurl: ""

theme: minima

# News items are posts: one Markdown file per item in _posts/, named
# YYYY-MM-DD-short-title.md (see _posts/README.md). These defaults give every
# news item the "post" layout and a /news/YEAR/MONTH/title/ address.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /news/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Logo (see images/README.md): the tree on its own. Used as a fallback in the
# header and footer when no wordmark is set below.
logo: /images/hub-logo.svg

# Wordmark: the logo with "Epidemic Science Hub" written beside it, as ONE image
# (SVG or a PNG about 1200px wide, transparent background). When set, the header
# and footer show this image instead of the tree + site name text.
logo_wordmark: /images/logo_wordmark.png

# Pages shown in the top navigation, in this order.
header_pages:
  - index.html
  - people.html
  - research.html
  - publications.html
  - join-us.html
  - contact.html

# Files that live in the repo but should not be published.
exclude:
  - README.md
  - LICENSE
  - images/README.md
  - _posts/README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor
