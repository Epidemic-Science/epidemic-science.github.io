# ==============================================================================
# LABS IN THE EPIDEMIC SCIENCE HUB
# Every page (Home, Labs, People, Join Us, footer) reads from this file, so a
# change here updates the whole site. The order below is the display order.
#
# Fields
#   id          short key, lowercase; people.yml uses it to assign people to a lab
#   short_name  name shown on cards and headings
#   full_name   full lab name
#   pi          lab lead
#   pi_email    optional; shows an "Email" button when filled in
#   website     optional; shows a "Visit Lab Website" button when filled in
#   color       the lab's colour (hex); used for card borders, tags, dots
#   logo        optional; path to an image in /images/labs/
#   summary     one short paragraph for the lab card
#   themes      optional; a few keywords shown as tags on the card
# ==============================================================================

- id: ceph
  short_name: CEPH Lab
  full_name: Laboratory for Computational Epidemiology and Public Health
  pi: Marco Ajelli
  pi_email: majelli@iu.edu
  website: https://ceph-lab.github.io
  color: "#468b94"   # teal
  logo: ""
  summary: >-
    Develops mathematical, computational, and statistical models to advance the
    understanding of infectious disease epidemiology and provide actionable
    insights to inform public health policy.
  themes: []

- id: seal
  short_name: SEALab
  full_name: Social and Epidemic Analytics Lab
  pi: Maria Litvinova
  pi_email: malitv@iu.edu
  website: ""
  color: "#11193D"   # midnight blue
  logo: ""
  summary: >-
    Studies how social, behavioral, biological, and environmental factors
    shape infectious disease transmission, using sociodemographic and
    epidemiologic data and statistical models to inform forecasting,
    preparedness, and public health interventions.
  themes: []

- id: mcore
  short_name: MCORE Lab
  full_name: Mosquito Control and Outbreak REsponse
  pi: André Wilke
  pi_email: andwilke@iu.edu
  website: ""
  color: "#f58a06"   # orange
  logo: ""
  summary: >-
    Investigates the ecological and evolutionary mechanisms of mosquito adaptation to
    urban habitats and how anthropogenic landscapes shape vector diversity and pathogen
    transmission.
  themes: []
