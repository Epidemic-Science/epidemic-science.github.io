# ==============================================================================
# PEOPLE IN THE EPIDEMIC SCIENCE HUB
# The People page lists everyone together, in the sections set in
# _data/people_groups.yml (Faculty, Postdoctoral Fellows, Doctoral Students,
# Master's Students, Undergraduate Students, Research Staff). Within a section,
# people appear in the order they are listed here. Each card shows a tag for
# each of the person's labs.
#
# Fields
#   name     full name
#   group    section: faculty, postdoc, phd, masters, undergrad or staff
#   role     line shown under the name (e.g. Professor, PhD Epidemiology)
#   lab      the lab `id` from _data/labs.yml (ceph, seal, mcore). For someone
#            in more than one lab, list them all: `lab: seal, mcore`
#            (each gets its own tag)
#   image    optional; square photo in /images/people/ (see images/README.md).
#            Leave blank, or point to a missing file, to show a placeholder.
#   alumni   optional; set to true to list the person under "Alumni" instead
# ==============================================================================

